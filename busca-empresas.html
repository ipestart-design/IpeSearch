<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="https://gabriel2003fonseca-prog.github.io/IpeSearch/logo2.png?v=1" type="image/png">

    <title>Pesquisar Empresas - IPÊ CONECT</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="search-view">
        <section class="search-section">
            <video class="video-bg" autoplay muted loop playsinline>
                <source src="video.mp4" type="video/mp4">
            </video>
            <div class="video-overlay"></div>

            <div class="search-content-wrapper">
                <h1 class="search-title">Encontre Empresas Parceiras</h1>
                
                <div class="search-container-modern">
                    <input type="text" id="searchInput" placeholder="Busque por nome, setor ou tecnologia...">
                    <button id="clearBtn" class="btn-clear-modern hidden" type="button">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <div class="quick-tags-container">
                    <button class="tag-btn" onclick="filtrarTag('Agrotech')">Agrotech</button>
                    <button class="tag-btn" onclick="filtrarTag('Biotecnologia')">Biotecnologia</button>
                    <button class="tag-btn" onclick="filtrarTag('Software')">Software</button>
                    <button class="tag-btn" onclick="filtrarTag('Engenharia')">Engenharia</button>
                    <button class="tag-btn" onclick="filtrarTag('ESG')">ESG</button>
                    <button class="tag-btn" onclick="filtrarTag('Pecuária')">Pecuária</button>
                </div>
                
                <div class="info-disclaimer">
                    <div class="disclaimer-icon"><i class="fas fa-info-circle"></i></div>
                    <div class="disclaimer-content">
                        <p>Empresas do <strong>ecossistema de inovação UFLA/IpêTech</strong>.</p>
                    </div>
                </div>
            </div>
        </section>

        <div id="counter" style="text-align: center; color: #5A6A85; font-weight: 500; margin-top: 30px;"></div>
        <div id="loading" style="text-align: center; padding: 20px; display: none; color: #003366;">
            <i class="fas fa-spinner fa-spin"></i> Carregando ecossistema...
        </div>
        <div class="results-container" id="resultsContainer"></div>
    </div>

    <div id="profile-view" class="hidden">
        <div style="height: 100px;"></div> 
        <div class="back-btn-container">
            <button type="button" class="btn-text-back" onclick="fecharPerfil()">
                <i class="fas fa-arrow-left"></i> Voltar para a pesquisa
            </button>
        </div>

        <div class="profile-card">
            <div class="profile-header">
                <img id="empresa-logo-modal" src="" alt="Logo" style="object-fit: contain; background: white; padding: 5px;">
                <div>
                    <h1 id="empresa-nome">Nome da Empresa</h1>
                    <span class="dept-badge" id="empresa-setor">Setor</span>
                </div>
            </div>

            <div class="profile-body">
                <div class="info-grid">
                    <div class="info-item"><strong>Setor</strong><p id="modal-setor-info"></p></div>
                    <div class="info-item"><strong>Especialidades</strong><p id="empresa-especialidade"></p></div>
                </div>

                <h2 class="section-title">Sobre a Empresa</h2>
                <div class="text-content" id="empresa-sobre" style="white-space: pre-wrap;"></div>
                
                <div class="last-update" style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 15px;">
                    <i class="fas fa-map-marker-alt"></i> Localização: IpêTech - Lavras/MG
                </div>
            </div>
        </div>
    </div>

    <script src="header.js"></script>
    <script src="footer.js"></script>
    <script src="chat.js"></script>

    <script>
        // 1. CONFIGURAÇÃO SUPABASE
        const SUPABASE_URL = 'https://zfcoyirqxythradtiatn.supabase.co';
        const SUPABASE_KEY = 'SUA_ANON_KEY_AQUI'; // <--- COLE SUA ANON KEY AQUI
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let empresasData = [];

        // 2. BUSCAR DADOS
        async function buscarEmpresas() {
            const loading = document.getElementById('loading');
            const container = document.getElementById('resultsContainer');
            
            try {
                loading.style.display = 'block';
                const { data, error } = await _supabase
                    .from('empresas')
                    .select('*')
                    .order('nome');

                if (error) throw error;
                empresasData = data;
                renderizarCards(empresasData);
            } catch (e) {
                console.error(e);
                container.innerHTML = "<p style='text-align:center;'>Erro ao conectar com o banco de dados.</p>";
            } finally {
                loading.style.display = 'none';
            }
        }

        // 3. RENDERIZAR
        function renderizarCards(lista) {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';
            document.getElementById('counter').innerText = `${lista.length} empresas encontradas`;

            lista.forEach(emp => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => abrirPerfil(emp);
                
                // Trata as tags para exibição
                const tagsExibicao = emp.tags ? emp.tags.slice(0, 3).join(', ') : 'Inovação';

                card.innerHTML = `
                    <div class="empresa-card-header">
                        <img src="${emp.logo_url}" alt="Logo" class="empresa-logo" onerror="this.src='https://placehold.co/80?text=Logo'">
                        <div class="empresa-info">
                            <h3>${emp.nome}</h3>
                            <div class="empresa-setor">${emp.setor}</div>
                        </div>
                    </div>
                    <div class="card-content-area">
                        <strong>Destaque:</strong> ${tagsExibicao}
                    </div>
                    <div class="card-footer">
                        <span>IpêTech UFLA</span>
                        <div class="card-hint">Ver perfil →</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 4. FILTROS
        function filtrarResultados() {
            const termo = document.getElementById('searchInput').value.toLowerCase();
            const filtrados = empresasData.filter(emp => 
                emp.nome.toLowerCase().includes(termo) || 
                emp.setor.toLowerCase().includes(termo) ||
                (emp.tags && emp.tags.some(t => t.toLowerCase().includes(termo)))
            );
            renderizarCards(filtrados);
        }

        function filtrarTag(tag) {
            document.getElementById('searchInput').value = tag;
            document.getElementById('clearBtn').classList.remove('hidden');
            filtrarResultados();
        }

        // 5. MODAL / PERFIL
        function abrirPerfil(dados) {
            document.getElementById('empresa-logo-modal').src = dados.logo_url;
            document.getElementById('empresa-nome').innerText = dados.nome;
            document.getElementById('empresa-setor').innerText = dados.setor;
            document.getElementById('modal-setor-info').innerText = dados.setor;
            document.getElementById('empresa-especialidade').innerText = dados.tags ? dados.tags.join(' • ') : 'N/A';
            document.getElementById('empresa-sobre').innerText = dados.descricao;
            
            document.getElementById('search-view').classList.add('hidden');
            document.getElementById('profile-view').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function fecharPerfil() {
            document.getElementById('profile-view').classList.add('hidden');
            document.getElementById('search-view').classList.remove('hidden');
        }

        // 6. EVENTOS
        document.getElementById('searchInput').addEventListener('input', (e) => {
            document.getElementById('clearBtn').classList.toggle('hidden', !e.target.value);
            filtrarResultados();
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('searchInput').value = '';
            document.getElementById('clearBtn').classList.add('hidden');
            renderizarCards(empresasData);
        });

        window.onload = buscarEmpresas;
    </script>
</body>
</html>
