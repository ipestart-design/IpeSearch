<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Soluções - IPÊ CONECT</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="icon" href="https://gabriel2003fonseca-prog.github.io/IpeSearch/logo2.png?v=1" type="image/png">
    
    <link rel="stylesheet" href="style.css">

    <style>
        /* --- RESET BÁSICO (APENAS O NECESSÁRIO) --- */
        * { box-sizing: border-box; }
        
        body {
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
            color: #1e293b;
            /* REMOVIDO display:flex daqui para não quebrar o Header/Footer */
        }

        /* --- WRAPPER PARA CENTRALIZAR APENAS O CONTEÚDO --- */
        .page-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center; /* Centraliza verticalmente */
            
            /* PADDING OBRIGATÓRIO PARA O HEADER NÃO TAMPAR */
            padding-top: 120px; 
            padding-bottom: 60px;
            padding-left: 20px;
            padding-right: 20px;
        }

        /* --- CARTÃO FLUTUANTE (DESIGN DO CHAT) --- */
        .split-layout {
            display: flex;
            width: 100%;
            max-width: 1200px;
            height: 75vh;
            min-height: 600px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px -10px rgba(0, 0, 0, 0.15);
            border: 1px solid #e2e8f0;
            position: relative;
            z-index: 1;
        }

        /* LADO ESQUERDO (TEXTO) */
        .info-side {
            flex: 1;
            padding: 60px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 1px solid #e2e8f0;
        }

        .info-side h1 { font-size: 3rem; font-weight: 900; color: #0f172a; line-height: 1.1; margin-bottom: 20px; }
        .info-side h1 span { color: #00c2cb; }
        .info-side p { font-size: 1.1rem; color: #64748b; line-height: 1.6; margin-bottom: 40px; }
        
        .steps { display: flex; flex-direction: column; gap: 25px; }
        .step { display: flex; align-items: center; gap: 15px; }
        .step-icon { width: 40px; height: 40px; background: #e0f2fe; color: #0284c7; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1rem; }
        .step-text { font-size: 1rem; color: #334155; font-weight: 600; }

        /* LADO DIREITO (CHAT) */
        .chat-side {
            flex: 1.4;
            background: #efeae2;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-blend-mode: overlay;
            display: flex; flex-direction: column; position: relative;
        }

        .chat-header { padding: 15px 25px; background: #f0f2f5; border-bottom: 1px solid #d1d7db; display: flex; align-items: center; gap: 15px; height: 70px; }
        .ai-avatar { width: 45px; height: 45px; background: #00c2cb; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .ai-info h3 { margin: 0; font-size: 1rem; color: #111b21; }
        .ai-info span { font-size: 0.8rem; color: #667781; }

        .chat-messages { flex: 1; padding: 20px 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        .message { max-width: 80%; padding: 10px 15px; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; position: relative; animation: fadeIn 0.3s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .message.bot { background: white; color: #111b21; align-self: flex-start; border-top-left-radius: 0; }
        .message.user { background: #d9fdd3; color: #111b21; align-self: flex-end; border-top-right-radius: 0; }

        .chat-solution-card { background: white; border: 1px solid #00c2cb; padding: 15px; border-radius: 8px; margin-top: 5px; }
        .chat-actions { display: flex; gap: 10px; margin-top: 10px; }
        .action-btn { flex: 1; padding: 8px; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
        .btn-accept { background: #00a884; color: white; }
        .btn-reject { background: #e9edef; color: #111b21; }

        .chat-input-area { padding: 15px 20px; background: #f0f2f5; border-top: 1px solid #d1d7db; display: flex; gap: 10px; align-items: center; }
        .chat-input-area input { flex: 1; padding: 12px 15px; border: none; border-radius: 8px; font-size: 1rem; outline: none; background: white; }
        .chat-input-area button { background: #00a884; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 900px) {
            .page-wrapper { padding-top: 100px; padding-bottom: 20px; display: block; min-height: auto; }
            .split-layout { flex-direction: column; height: 700px; border-radius: 15px; }
            .info-side { display: none; }
            .chat-side { height: 100%; }
        }
    </style>
</head>
<body>

    <script src="header.js"></script>

    <div class="page-wrapper">
        <div class="split-layout">
            
            <div class="info-side">
                <h1>Qual é o seu <br><span>Desafio?</span></h1>
                <p>Nossa IA analisa sua dor e busca soluções imediatas no banco de talentos da UFLA.</p>
                <div class="steps">
                    <div class="step"><div class="step-icon">1</div><div class="step-text">Descreva o problema.</div></div>
                    <div class="step"><div class="step-icon">2</div><div class="step-text">IA verifica o banco.</div></div>
                    <div class="step"><div class="step-icon">3</div><div class="step-text">Conexão imediata.</div></div>
                </div>
            </div>

            <div class="chat-side">
                <div class="chat-header">
                    <div class="ai-avatar"><i class="fas fa-robot"></i></div>
                    <div class="ai-info"><h3>IPÊ.IA - Triagem</h3><span>Online agora</span></div>
                </div>
                <div class="chat-messages" id="chatBox">
                    <div class="message bot">Olá! 👋 Sou a IA do Ipê Conect.<br><br><strong>Qual problema sua empresa precisa resolver hoje?</strong></div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="userInput" placeholder="Digite aqui..." onkeypress="handleEnter(event)">
                    <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

        </div>
    </div>

    <script src="footer.js"></script>

    <script>
        // Mesma lógica de chat anterior
        const SOLUTIONS_DB = [
            { keywords: ['praga', 'café', 'drone'], name: 'AgroCorp', desc: 'Monitoramento de pragas com drones.' },
            { keywords: ['energia', 'solar'], name: 'GreenEnergy', desc: 'Otimização de consumo energético.' },
            { keywords: ['venda', 'marketing'], name: 'SalesForceX', desc: 'Automação de funil de vendas.' }
        ];
        let step = 0; let ticketData = { problem: '', name: '', email: '' };
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');

        function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            appendMessage(text, 'user');
            userInput.value = '';
            
            if (step === 0) {
                ticketData.problem = text;
                showTyping();
                setTimeout(() => { removeTyping(); checkSolutions(text); }, 1500);
            } else if (step === 2) {
                ticketData.name = text;
                appendMessage(`Obrigado, ${text}. Qual seu e-mail?`, 'bot');
                step = 3;
            } else if (step === 3) {
                ticketData.email = text;
                finishRegistration();
            }
        }

        function checkSolutions(text) {
            let found = SOLUTIONS_DB.find(sol => sol.keywords.some(k => text.toLowerCase().includes(k)));
            if (found) {
                step = 1;
                appendMessageHTML(`
                    <div class="chat-solution-card">
                        <h4>Solução Encontrada: ${found.name}</h4>
                        <p>${found.desc}</p>
                        <div class="chat-actions">
                            <button class="action-btn btn-accept" onclick="accept('${found.name}')">Conectar</button>
                            <button class="action-btn btn-reject" onclick="reject()">Cadastrar Novo</button>
                        </div>
                    </div>
                `, 'bot');
            } else {
                startRegistration();
            }
        }

        function startRegistration() { step = 2; appendMessage("Não encontrei match exato. Vamos cadastrar. Qual seu nome?", 'bot'); }
        function accept(name) { appendMessage(`Ótimo! Conectando com ${name}...`, 'bot'); }
        function reject() { appendMessageHTML('<div class="message user">Quero cadastrar.</div>', 'html-direct'); startRegistration(); }
        function finishRegistration() { showTyping(); setTimeout(() => { removeTyping(); appendMessage("✅ Cadastrado! Entraremos em contato.", 'bot'); }, 1000); }

        function appendMessage(text, type) {
            const div = document.createElement('div'); div.className = `message ${type}`; div.innerHTML = text;
            chatBox.appendChild(div); chatBox.scrollTop = chatBox.scrollHeight;
        }
        function appendMessageHTML(html, type) {
            if(type === 'html-direct') chatBox.insertAdjacentHTML('beforeend', html);
            else { const div = document.createElement('div'); div.className = `message ${type}`; div.innerHTML = html; chatBox.appendChild(div); }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        function showTyping() { chatBox.insertAdjacentHTML('beforeend', `<div id="typing" class="message bot">...</div>`); chatBox.scrollTop = chatBox.scrollHeight; }
        function removeTyping() { const el = document.getElementById('typing'); if(el) el.remove(); }
    </script>
</body>
</html>
